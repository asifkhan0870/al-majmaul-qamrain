<!DOCTYPE html>
<html lang="ur" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>شاعری کی محفل - All My Sher Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Nastaliq+Urdu:wght@400;500;600;700&family=Crimson+Text:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #8b4513;
        --secondary: #daa520;
        --accent: #cd853f;
        --bg-primary: #fff8e7;
        --bg-secondary: #f5e6d3;
        --text-primary: #2c1810;
        --text-secondary: #5d4e37;
        --border-color: #d4af37;
        --shadow: rgba(139, 69, 19, 0.15);
      }

      body {
        font-family: "Noto Nastaliq Urdu", "Amiri", serif;
        background: var(--bg-primary);
        color: var(--text-primary);
        line-height: 2;
        overflow-x: hidden;
      }

      /* Decorative Background Pattern */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: repeating-linear-gradient(
            45deg,
            transparent,
            transparent 100px,
            rgba(212, 175, 55, 0.02) 100px,
            rgba(212, 175, 55, 0.02) 200px
          ),
          repeating-linear-gradient(
            -45deg,
            transparent,
            transparent 100px,
            rgba(139, 69, 19, 0.02) 100px,
            rgba(139, 69, 19, 0.02) 200px
          );
        pointer-events: none;
        z-index: 0;
      }

      /* Header with Classical Design */
      header {
        position: relative;
        background: linear-gradient(135deg, var(--primary) 0%, #6b3410 100%);
        padding: 4rem 2rem 3rem;
        text-align: center;
        border-bottom: 5px solid var(--secondary);
        box-shadow: 0 10px 40px var(--shadow);
        overflow: hidden;
      }

      header::before {
        content: "❦";
        position: absolute;
        top: 1rem;
        left: 50%;
        transform: translateX(-50%);
        font-size: 3rem;
        color: var(--secondary);
        opacity: 0.3;
      }

      header::after {
        content: "";
        position: absolute;
        bottom: -2px;
        left: 0;
        right: 0;
        height: 8px;
        background: repeating-linear-gradient(
          90deg,
          var(--secondary) 0px,
          var(--secondary) 20px,
          transparent 20px,
          transparent 40px
        );
      }

      h1 {
        font-family: "Noto Nastaliq Urdu", serif;
        font-size: 4rem;
        font-weight: 700;
        color: var(--bg-primary);
        text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
        margin-bottom: 0.5rem;
        letter-spacing: 2px;
        animation: fadeInDown 1s ease-out;
      }

      .subtitle {
        font-family: "Crimson Text", serif;
        font-size: 1.2rem;
        color: var(--secondary);
        font-style: italic;
        animation: fadeInUp 1s ease-out 0.3s backwards;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Navigation and Controls */
      .controls {
        position: relative;
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 2rem;
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }

      .search-box {
        position: relative;
        flex: 1;
        min-width: 300px;
        max-width: 500px;
      }

      .search-box input {
        width: 100%;
        padding: 1rem 3rem 1rem 1.5rem;
        border: 2px solid var(--border-color);
        border-radius: 50px;
        background: white;
        font-family: "Noto Nastaliq Urdu", serif;
        font-size: 1.1rem;
        color: var(--text-primary);
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      }

      .search-box input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 6px 25px rgba(139, 69, 19, 0.2);
        transform: translateY(-2px);
      }

      .search-box::after {
        content: "🔍";
        position: absolute;
        left: 1.5rem;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
      }

      .filter-buttons {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .filter-btn {
        padding: 0.8rem 1.8rem;
        border: 2px solid var(--primary);
        background: white;
        color: var(--primary);
        font-family: "Noto Nastaliq Urdu", serif;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        border-radius: 25px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .filter-btn::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: var(--primary);
        transition: width 0.4s ease, height 0.4s ease;
        transform: translate(-50%, -50%);
        z-index: -1;
      }

      .filter-btn:hover::before,
      .filter-btn.active::before {
        width: 300px;
        height: 300px;
      }

      .filter-btn:hover,
      .filter-btn.active {
        color: white;
        border-color: var(--primary);
        transform: translateY(-2px);
        box-shadow: 0 5px 15px var(--shadow);
      }

      /* Main Container */
      .container {
        position: relative;
        max-width: 1400px;
        margin: 3rem auto;
        padding: 0 2rem 4rem;
        z-index: 10;
      }

      /* Poetry Grid */
      .poetry-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
        gap: 2.5rem;
        animation: fadeIn 0.8s ease-out;
      }
      
      @media (max-width: 500px) {
        .poetry-grid {
          grid-template-columns: 1fr;
          gap: 1.5rem;
        }
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Poetry Card */
      .poetry-card {
        background: white;
        border: 3px solid var(--border-color);
        border-radius: 15px;
        padding: 2.5rem;
        position: relative;
        transition: all 0.4s ease;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        animation: slideUp 0.6s ease-out backwards;
      }

      .poetry-card:nth-child(1) {
        animation-delay: 0.1s;
      }
      .poetry-card:nth-child(2) {
        animation-delay: 0.2s;
      }
      .poetry-card:nth-child(3) {
        animation-delay: 0.3s;
      }
      .poetry-card:nth-child(4) {
        animation-delay: 0.4s;
      }
      .poetry-card:nth-child(5) {
        animation-delay: 0.5s;
      }
      .poetry-card:nth-child(6) {
        animation-delay: 0.6s;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(40px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .poetry-card::before {
        content: "❋";
        position: absolute;
        top: -15px;
        right: 50%;
        transform: translateX(50%);
        font-size: 2rem;
        color: var(--secondary);
        background: white;
        padding: 0 10px;
      }

      .poetry-card:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 50px rgba(139, 69, 19, 0.2);
        border-color: var(--accent);
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 2px solid var(--bg-secondary);
      }

      .poet-name {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--primary);
      }

      .poetry-type {
        background: linear-gradient(135deg, var(--accent), var(--secondary));
        color: white;
        padding: 0.4rem 1.2rem;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 600;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
      }

      .poetry-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
        text-align: center;
      }

      .poetry-content {
        /* font-size: 0.5rem; */
        line-height: 2.5;
        /* width: ; */
        color: var(--text-primary);
    
        margin-bottom: 1.5rem;
      }

      .couplet {
        margin-bottom: 1.8rem;
        padding: 1rem;
        border-right: 4px solid var(--accent);
        background: linear-gradient(
          to left,
          rgba(218, 165, 32, 0.05),
          transparent
        );
        border-radius: 0 8px 8px 0;
        transition: all 0.3s ease;
      }

      .couplet:hover {
        background: linear-gradient(
          to left,
          rgba(218, 165, 32, 0.1),
          transparent
        );
        transform: translateX(-5px);
      }

      .line {
        padding: 0.3rem 0;
      }

      .card-footer {
        display: flex;
        gap: 1rem;
        justify-content: flex-start;
        padding-top: 1rem;
        border-top: 2px solid var(--bg-secondary);
      }

      .action-btn {
        padding: 0.6rem 1.2rem;
        border: none;
        background: var(--secondary);
        color: white;
        font-family: "Noto Nastaliq Urdu", serif;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        border-radius: 20px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .action-btn:hover {
        background: var(--primary);
        transform: scale(1.05);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      /* Audio Player */
      .audio-player {
        display: none;
        margin-top: 1rem;
        padding: 1rem;
        background: var(--bg-secondary);
        border-radius: 10px;
        align-items: center;
        gap: 1rem;
      }

      .audio-player.active {
        display: flex;
      }

      .audio-player audio {
        flex: 1;
        height: 40px;
      }

      /* Share Modal */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        z-index: 1000;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s ease;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: white;
        padding: 3rem;
        border-radius: 20px;
        max-width: 600px;
        width: 90%;
        text-align: center;
        border: 4px solid var(--border-color);
        animation: scaleIn 0.3s ease;
        position: relative;
      }

      @keyframes scaleIn {
        from {
          transform: scale(0.8);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }

      .modal-content h3 {
        font-size: 1rem;
        color: var(--primary);
        margin-bottom: 1.5rem;
      }

      .share-text {
        background: var(--bg-secondary);
        padding: 2rem;
        border-radius: 10px;
        /* font-size: 1.4rem; */
        line-height: 2.2;
        margin-bottom: 1.5rem;
        border: 2px solid var(--border-color);
      }

      .share-buttons {
        display: flex;
        gap: 1rem;
        justify-content: center;
        flex-wrap: wrap;
      }

      .close-modal {
        position: absolute;
        top: 1rem;
        left: 1rem;
        background: var(--primary);
        color: white;
        border: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        font-size: 1.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .close-modal:hover {
        background: var(--secondary);
        transform: rotate(90deg);
      }

      /* No Results Message */
      .no-results {
        text-align: center;
        padding: 4rem 2rem;
        font-size: 1.5rem;
        color: var(--text-secondary);
        display: none;
      }

      .no-results.active {
        display: block;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        h1 {
          font-size: 2.5rem;
        }

        .poetry-grid {
          grid-template-columns: 1fr;
        }

        .controls {
          flex-direction: column;
        }

        .search-box {
          max-width: 100%;
        }

        .poetry-content {
          font-size: 0.95rem;
          line-height: 2;
        }
        
        .poetry-card {
          padding: 1.5rem;
        }
      }
      
      /* Smaller tablets and large phones */
      @media (max-width: 480px) {
        h1 {
          font-size: 2rem;
        }
        
        .poetry-content {
          font-size: 0.85rem;
          line-height: 1.8;
        }
        
        .poetry-card {
          padding: 1.2rem;
        }
        
        .couplet {
          padding: 0.8rem;
          margin-bottom: 1.5rem;
        }
      }
      
      /* Very small phones */
      @media (max-width: 380px) {
        h1 {
          font-size: 1.8rem;
        }
        
        .poetry-content {
          font-size: 0.75rem;
          line-height: 1.6;
        }
        
        .poetry-card {
          padding: 1rem;
        }
        
        .couplet {
          padding: 0.6rem;
          margin-bottom: 1.2rem;
        }
      }
      
      /* Extra small screens */
      @media (max-width: 320px) {
        .poetry-content {
          font-size: 0.68rem;
          line-height: 1.5;
        }
      }

      /* Loading Animation */
      .loading {
        text-align: center;
        padding: 4rem;
        font-size: 1.5rem;
        color: var(--primary);
      }

      .loading::after {
        content: "...";
        animation: dots 1.5s infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60%,
        100% {
          content: "...";
        }
      }
    </style>
  </head>

      let currentFilter = "all";
      let currentShareText = "";

      // Render Poetry Cards
      function renderPoetry(filter = "all", searchTerm = "") {
        const grid = document.getElementById("poetryGrid");
        const noResults = document.getElementById("noResults");

        let filteredData = poetryData;

        // Filter by type
        if (filter !== "all") {
          filteredData = filteredData.filter((item) => item.type === filter);
        }

        // Filter by search term
        if (searchTerm) {
          filteredData = filteredData.filter((item) => {
            const searchLower = searchTerm.toLowerCase();
            const poetMatch = item.poet.toLowerCase().includes(searchLower);
            const titleMatch = item.title.toLowerCase().includes(searchLower);
            const contentMatch = item.couplets.some((couplet) =>
              couplet.lines.some((line) =>
                line.toLowerCase().includes(searchLower)
              )
            );
            return poetMatch || titleMatch || contentMatch;
          });
        }

        // Show/hide no results message
        if (filteredData.length === 0) {
          grid.innerHTML = "";
          noResults.classList.add("active");
          return;
        } else {
          noResults.classList.remove("active");
        }

        // Render cards
        grid.innerHTML = filteredData
          .map(
            (item, index) => `
                <div class="poetry-card">
                    <div class="card-header">
                        <span class="poet-name">${item.poet}</span>
                        <span class="poetry-type">${getTypeLabel(
                          item.type
                        )}</span>
                    </div>
                    ${
                      item.title
                        ? `<div class="poetry-title">${item.title}</div>`
                        : ""
                    }
                    <div class="poetry-content">
                        ${item.couplets
                          .map(
                            (couplet, cIndex) => `
                            <div class="couplet">
                                ${couplet.lines
                                  .map(
                                    (line) => `
                                    <div class="line">${line}</div>
                                `
                                  )
                                  .join("")}
                            </div>
                        `
                          )
                          .join("")}
                    </div>
                    <div class="card-footer">
                        <button class="action-btn" onclick="sharePoetry(${
                          item.id
                        })">
                            📤 شئیر
                        </button>
                        ${
                          item.audioUrl
                            ? `
                            <button class="action-btn" onclick="toggleAudio(${item.id})">
                                🎵 آڈیو
                            </button>
                        `
                            : ""
                        }
                    </div>
                    ${
                      item.audioUrl
                        ? `
                        <div class="audio-player" id="audio-${item.id}">
                            <audio controls src="${item.audioUrl}"></audio>
                        </div>
                    `
                        : ""
                    }
                </div>
            `
          )
          .join("");
      }

      function getTypeLabel(type) {
        const labels = {
          ghazal: "غزل",
          nazm: "نظم",
          sher: "شعر",
        };
        return labels[type] || type;
      }

      // Filter buttons
      document.querySelectorAll(".filter-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          document
            .querySelectorAll(".filter-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          currentFilter = this.dataset.filter;
          renderPoetry(
            currentFilter,
            document.getElementById("searchInput").value
          );
        });
      });

      // Search functionality
      document
        .getElementById("searchInput")
        .addEventListener("input", function (e) {
          renderPoetry(currentFilter, e.target.value);
        });

      // Share Poetry
      function sharePoetry(id) {
        const item = poetryData.find((p) => p.id === id);
        if (!item) return;

        let shareContent = `${item.poet}${
          item.title ? ` - ${item.title}` : ""
        }\n\n`;
        shareContent += item.couplets
          .map((c) => c.lines.join("\n"))
          .join("\n\n");

        currentShareText = shareContent;
        document.getElementById("shareText").textContent = shareContent;
        document.getElementById("shareModal").classList.add("active");
      }

      function closeModal() {
        document.getElementById("shareModal").classList.remove("active");
      }

      function copyToClipboard() {
        navigator.clipboard.writeText(currentShareText).then(() => {
          alert("کاپی ہو گیا!");
          closeModal();
        });
      }

      function shareOnWhatsApp() {
        const url = `https://wa.me/?text=${encodeURIComponent(
          currentShareText
        )}`;
        window.open(url, "_blank");
      }

      function shareOnTwitter() {
        const url = `https://twitter.com/intent/tweet?text=${encodeURIComponent(
          currentShareText
        )}`;
        window.open(url, "_blank");
      }

      // Toggle Audio
      function toggleAudio(id) {
        const audioPlayer = document.getElementById(`audio-${id}`);
        if (audioPlayer) {
          audioPlayer.classList.toggle("active");
        }
      }

      // Close modal on outside click
      document
        .getElementById("shareModal")
        .addEventListener("click", function (e) {
          if (e.target === this) {
            closeModal();
          }
        });

      // Initial render
      renderPoetry();

      // Function to add new poetry (you can call this to add more entries)
      function addPoetry(newPoem) {
        poetryData.push({
          ...newPoem,
          id: poetryData.length + 1,
        });
        renderPoetry(
          currentFilter,
          document.getElementById("searchInput").value
        );
      }
